packages:
  - client

overrides:
  '@cypress/request>tough-cookie': 4.1.4
  '@babel/traverse': 7.28.0
  dot-prop: 4.2.1
  form-data: 4.0.6
  ini: 1.3.8
  minimist: 1.2.8
  node-notifier: 5.4.5
  nodemailer: 10.0.13
  property-expr: 2.0.6
  psl: 1.15.0
  rollup: ^4.43.0
  unset-value: 2.0.1
  vite: ^7.3.5
  yargs-parser: 13.1.2

# Which dependency build scripts may run; the rest are banners or telemetry.
allowBuilds:
  cypress: true
  esbuild: true
  '@scarf/scarf': false
  core-js: false
  core-js-pure: false
  react-table: false
  styled-components: false
