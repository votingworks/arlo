[project]
name = "arlo"
version = "0.1.0"
description = ""
authors = []
requires-python = "~=3.11.0"
dependencies = [
    "alembic>=1.4.3,<2",
    "Authlib>=1.6.12,<2",
    "chardet>=3.0.4,<4",
    "Flask>=3.1.3,<4",
    "flask-talisman>=1.1.0,<2",
    "jsonschema>=4.26.0,<5",
    "numpy>=1.22.0,<2",
    "requests>=2.33.0,<3",
    "SQLAlchemy-Utils==0.38.3",
    "xkcdpass>=1.19.2,<2",
    "SQLAlchemy~=1.3.20",
    "typing-extensions>=4.1.0,<5",
    "auth0-python>=3.16.2,<4",
    "gunicorn>=23.0.0,<24",
    "sentry-sdk[flask]>=2.36.0,<3",
    "athena",
    "psycopg2-binary>=2.9.9,<3",
    "consistent-sampler",
    "scipy~=1.11.0",
    "Flask-SeaSurf>=2.0.0,<3",
    "boto3>=1.20.8,<2",
    "r2b2",
    "MarkupSafe==3.0.2",
    "jinja2==3.1.6",
    "itsdangerous==2.2.0",
    "werkzeug>=3.1.9,<4",
    "defusedxml>=0.7.1,<0.8",
]

[dependency-groups]
dev = [
    "filelock>=3.20.3,<4",
    "pytest>=6.2.4,<7",
    "pytest-cov>=2.12.1,<3",
    "pytest-testmon>=2.2.0,<3",
    "snapshottest>=0.6.0,<0.7",
    "pytest-alembic>=0.2.5,<0.3",
    "pytest-xdist>=2.3.0,<3",
    "sqlalchemy-stubs>=0.3,<0.4",
    "noauth",
    "ruff>=0.12.12,<0.13",
    "ty==0.0.90",
    "watchdog>=6.0.0,<7",
    "types-chardet>=5.0.4.6,<6",
    "types-boto3>=1.40.51,<2",
    "types-defusedxml>=0.7.0.20250822,<0.8",
]

[tool.uv]
package = false
default-groups = "all"

[tool.uv.sources]
noauth = { git = "https://github.com/votingworks/nOAuth.git", rev = "542245905c0024977a2d2ef08309b606a7ae98c8" }
athena = { git = "https://github.com/filipzz/athena.git", rev = "9e07d15aff2098231c23024c68419bfe02796471" } # v0.8.3
consistent-sampler = { git = "https://github.com/votingworks/consistent_sampler.git", rev = "46f6f0a6761adc7172e2c3e844bee359e6bd11bf" }
r2b2 = { git = "https://github.com/gwexploratoryaudits/r2b2.git", rev = "43479256a349c5ffea061d1b8dcc8fac5d9a64de" }

[tool.ty.environment]
extra-paths = ["stubs"]

[tool.ty.src]
exclude = ["stubs", "server/tests/arlo-extra-tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
blanket-ignore-comment = "error"
division-by-zero = "error"
dynamic-function-decorator-return = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"

# Audit math tests build loosely typed fixtures (e.g. `int` keys for `str` IDs).
[[tool.ty.overrides]]
include = ["server/tests/audit_math/**"]
rules = { invalid-argument-type = "ignore", invalid-assignment = "ignore" }

[tool.ruff.lint]
extend-select = ["ANN001", "ANN002", "ANN003"]
ignore = [
  # TODO: stop using * imports, then re-enable these
  "F405",
  "F403",
]

[tool.ruff.lint.per-file-ignores]
"server/migrations/**" = ["ANN"]
"fixtures/test/**" = ["ANN"]
"server/tests/**" = ["ANN"]
